<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python Selangkah Demi Selangkah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=JetBrains+Mono:wght@400;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fa;--card:#fff;--ink:#14213d;--mute:#5b6b86;--line:#d3ddec;--blue:#2f6db5;--blue2:#e2eefb;--gold:#f2c14e;--ok:#1d8a5a;--okbg:#dff4ea;--bad:#c2410c;--badbg:#fde8dc;--code:#14213d;--codeink:#e8eefb;--str:#f2c14e;--kw:#8fc0ff;--cm:#7f8fae;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#16233a;--ink:#e8eefb;--mute:#9bacc9;--line:#26385a;--blue:#6fa8ee;--blue2:#1b2f4f;--okbg:#12362a;--ok:#4fd39a;--badbg:#3a2316;--bad:#ff9a62;--code:#0a111e}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#16233a;--ink:#e8eefb;--mute:#9bacc9;--line:#26385a;--blue:#6fa8ee;--blue2:#1b2f4f;--okbg:#12362a;--ok:#4fd39a;--badbg:#3a2316;--bad:#ff9a62;--code:#0a111e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 Figtree,system-ui,sans-serif;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;background:var(--bg);opacity:.82;z-index:-1}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;line-height:1.15;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 80px}
header{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:28px}
.brand{font:800 20px 'Bricolage Grotesque';color:var(--ink);text-decoration:none;display:flex;gap:8px;align-items:center}
.brand i{display:inline-block;width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--blue) 50%,var(--gold) 50%)}
.tools{display:flex;gap:8px}
button,.btn{font:600 15px Figtree,sans-serif;cursor:pointer;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;text-decoration:none;display:inline-block}
button:focus-visible,a:focus-visible,label:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:disabled{background:var(--line);border-color:var(--line);color:var(--mute);cursor:not-allowed}
.hero h1{font-size:clamp(34px,8vw,54px);font-weight:800;letter-spacing:-.02em;max-width:14ch}
.hero p{color:var(--mute);max-width:46ch;margin:14px 0 22px}
.meter{background:var(--blue2);border-radius:99px;height:12px;overflow:hidden;margin:6px 0 4px}
.meter b{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .5s}
.small{font-size:14px;color:var(--mute)}
.trail{list-style:none;margin:34px 0 0;padding:0 0 0 30px;position:relative}
.trail::before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:3px;background:var(--line);border-radius:3px}
.trail li{position:relative;margin-bottom:14px}
.dot{position:absolute;left:-30px;top:20px;width:25px;height:25px;border-radius:50%;background:var(--card);border:3px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.st-open .dot{border-color:var(--blue);background:var(--gold)}
.st-done .dot{border-color:var(--ok);background:var(--ok);color:#fff}
.node{display:block;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;text-decoration:none;color:inherit}
.st-open .node{border-color:var(--blue);box-shadow:0 6px 0 var(--blue2)}
.st-lock .node{opacity:.55;cursor:not-allowed}
.node h3{font-size:20px}
.node span{color:var(--mute);font-size:15px}
.tag{float:right;font-size:13px;font-weight:600;border-radius:99px;padding:2px 10px;background:var(--blue2);color:var(--blue)}
.st-done .tag{background:var(--okbg);color:var(--ok)}
.st-lock .tag{background:var(--line);color:var(--mute)}
.crumb{color:var(--mute);font-size:15px;margin-bottom:6px}
.lesson h1{font-size:clamp(30px,7vw,44px);font-weight:800;margin-bottom:6px}
.lesson h2{font-size:23px;margin:30px 0 8px}
.lesson p{margin:10px 0;max-width:62ch}
pre{background:var(--code);color:var(--codeink);border-radius:14px;padding:16px 18px;overflow-x:auto;font:400 15px/1.6 'JetBrains Mono',monospace;margin:14px 0 4px}
pre .k{color:var(--kw)}pre .s{color:var(--str)}pre .c{color:var(--cm)}
.out{font:400 14px/1.5 'JetBrains Mono',monospace;border-left:4px solid var(--gold);background:var(--card);padding:8px 14px;border-radius:0 10px 10px 0;margin:0 0 14px}
code{font:600 .9em 'JetBrains Mono',monospace;background:var(--blue2);padding:1px 6px;border-radius:6px}
.note{background:var(--blue2);border-radius:12px;padding:12px 16px;margin:16px 0}
.quiz{margin-top:38px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:22px 20px}
.quiz h2{margin-top:0!important}
.q{margin:20px 0}
.q p{font-weight:600;margin:0 0 8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer}
.opt input{margin-top:6px;accent-color:var(--blue)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.exp{font-size:15px;color:var(--mute);margin-top:6px}
.res{margin-top:18px;padding:14px 16px;border-radius:12px;font-weight:600}
.res.pass{background:var(--okbg);color:var(--ok)}
.res.fail{background:var(--badbg);color:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;max-width:90vw;z-index:9}
.cell{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin:16px 0}
.cell textarea{width:100%;min-height:96px;resize:none;overflow:hidden;background:var(--code);color:var(--codeink);border:0;border-radius:10px;padding:14px;font:400 15px/1.6 'JetBrains Mono',monospace;tab-size:4;white-space:pre}
.cell textarea:focus-visible{outline:3px solid var(--gold)}
.crow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.crow .sp{flex:1}
.outbox{margin-top:10px;background:var(--bg);border-left:4px solid var(--gold);border-radius:0 10px 10px 0;padding:10px 14px;font:400 14px/1.55 'JetBrains Mono',monospace;white-space:pre-wrap;word-break:break-word;min-height:20px}
.outbox:empty{display:none}
.outbox .er{color:var(--bad);font-weight:600}.outbox .mute{color:var(--mute)}
.outbox input{font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--blue);border-radius:6px;padding:1px 6px;min-width:12ch}
.pw{position:relative}
.try{position:absolute;top:10px;right:10px;font-size:13px;padding:4px 10px;background:var(--blue);color:#fff;border-color:var(--blue)}
.aibtn{display:none}.hasai .aibtn{display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 0}
.chip{font:600 13px 'JetBrains Mono',monospace;padding:5px 10px;border-radius:8px;background:var(--blue2);color:var(--blue);border-color:var(--blue2)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--gold);border-color:var(--gold);color:#14213d;border-radius:99px;padding:12px 20px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.aip{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;height:min(80vh,600px);z-index:8;background:var(--card);border:1.5px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.aip[hidden],.fab[hidden]{display:none}
.aih{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1.5px solid var(--line)}
.aih b{font:700 18px 'Bricolage Grotesque'}.aih .sp{flex:1}
.msgs{flex:1;overflow-y:auto;padding:14px 16px}
.m{max-width:92%;padding:10px 14px;border-radius:14px;margin:8px 0;font-size:16px;line-height:1.55;word-break:break-word}
.m.u{background:var(--blue);color:#fff;margin-left:auto;white-space:pre-wrap}
.m.a{background:var(--bg);border:1.5px solid var(--line)}
.m.err{color:var(--bad)}
.m pre{font-size:13px;padding:12px;margin:8px 0}
.m .try{top:6px;right:6px}
.hint .chip{font-family:Figtree,sans-serif;font-size:14px;text-align:left}
.aif{display:flex;gap:8px;padding:10px 12px;border-top:1.5px solid var(--line)}
.aif textarea{flex:1;resize:none;font:400 16px/1.4 Figtree,sans-serif;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--ink)}
[hidden]{display:none!important}
.peek{position:relative;height:250px;overflow:hidden;border-radius:14px;margin-top:14px}
.pk{padding:2px 4px;user-select:none;-webkit-user-select:none;pointer-events:none}
.bl1,.bl2{position:absolute;left:0;right:0;pointer-events:none}
.bl1{top:0;height:55%;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.bl2{top:45%;bottom:0;-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);background:linear-gradient(to bottom,transparent,var(--card) 90%);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 25%);mask-image:linear-gradient(to bottom,transparent,#000 25%)}
.start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 26px;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.lnk{background:none;border:0;color:var(--mute);text-decoration:underline;padding:8px 0;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(10,18,32,.6);display:grid;place-items:center;z-index:20;padding:16px}
.dlg{background:var(--card);border-radius:16px;padding:20px;max-width:380px;width:100%}
.dlg h3{font-size:22px;margin-bottom:6px}
.dlg input{width:100%;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin:8px 0 14px}
.inquiz .tools{display:none}.inquiz .brand{pointer-events:none}.inquiz .fab{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
<a class="brand" href="#/"><i></i>PyLangkah</a>
<div class="tools"><a class="btn" href="#/lab">Lab Kode</a><button id="theme" aria-label="Ganti tema">Tema</button><button id="reset">Ulangi dari awal</button></div>
</header>
<main id="app"></main>
</div>
<script>
const K=(s)=>`<span class="k">${s}</span>`;
const L=[
{t:'Halo, Python!',d:'Menampilkan tulisan dengan print()',
c:`<p>Python adalah bahasa pemrograman yang dibaca hampir seperti kalimat biasa. Program pertama hampir semua orang sama: menampilkan tulisan di layar dengan fungsi <code>print()</code>.</p>
<pre><span class="k">print</span>(<span class="s">"Halo, dunia!"</span>)
<span class="k">print</span>(<span class="s">"Aku belajar Python"</span>)</pre><div class="out">Halo, dunia!<br>Aku belajar Python</div>
<h2>Teks harus diapit tanda kutip</h2><p>Tulisan (disebut <b>string</b>) diapit tanda kutip dua <code>"..."</code> atau satu <code>'...'</code>. Tanpa kutip, Python mengira itu nama sesuatu dan akan error.</p>
<h2>Komentar</h2><p>Baris yang diawali <code>#</code> diabaikan Python. Gunakan untuk catatan bagi dirimu sendiri.</p>
<pre><span class="c"># ini komentar, tidak dijalankan</span>
<span class="k">print</span>(<span class="s">"Ini dijalankan"</span>)</pre>`,
q:[{q:'Perintah mana yang menampilkan Halo di layar?',o:['print(Halo)','print("Halo")','tampil "Halo"'],a:1,e:'Teks harus memakai tanda kutip di dalam print().'},
{q:'Apa fungsi tanda # di awal baris?',o:['Membuat baris menjadi komentar','Menjalankan baris dua kali','Menghapus baris'],a:0,e:'Baris yang diawali # diabaikan oleh Python.'},
{q:'Apa output dari print("2 + 3")?',o:['5','2 + 3','Error'],a:1,e:'Karena diapit kutip, itu hanya teks dan ditampilkan apa adanya.'}]},
{t:'Variabel dan Tipe Data',d:'Menyimpan nilai dengan nama',
c:`<p>Variabel adalah kotak berlabel untuk menyimpan nilai. Buat dengan tanda <code>=</code>.</p>
<pre>nama = <span class="s">"Sari"</span>
umur = 17
tinggi = 1.62
pelajar = <span class="k">True</span>
<span class="k">print</span>(nama, umur)</pre><div class="out">Sari 17</div>
<h2>Empat tipe dasar</h2><p><code>str</code> untuk teks, <code>int</code> untuk bilangan bulat, <code>float</code> untuk bilangan desimal, dan <code>bool</code> untuk benar/salah (<code>True</code> atau <code>False</code>).</p>
<pre><span class="k">print</span>(<span class="k">type</span>(umur))</pre><div class="out">&lt;class 'int'&gt;</div>
<div class="note">Aturan nama variabel: tidak boleh diawali angka, tidak boleh ada spasi (pakai <code>nama_depan</code>), dan huruf besar-kecil dibedakan.</div>`,
q:[{q:'Tipe data dari 3.14 adalah...',o:['int','float','str'],a:1,e:'Bilangan dengan titik desimal bertipe float.'},
{q:'Nama variabel mana yang valid?',o:['2nama','nama depan','nama_depan'],a:2,e:'Nama tidak boleh diawali angka atau mengandung spasi.'},
{q:'Setelah x = "7", tipe x adalah...',o:['str','int','bool'],a:0,e:'Karena ada tanda kutip, 7 di sini adalah teks.'}]},
{t:'Operator dan Perhitungan',d:'Matematika dan membandingkan nilai',
c:`<p>Python bisa dipakai seperti kalkulator.</p>
<pre><span class="k">print</span>(7 + 3)   <span class="c"># 10</span>
<span class="k">print</span>(7 // 2)  <span class="c"># 3  (bagi, dibulatkan ke bawah)</span>
<span class="k">print</span>(7 % 2)   <span class="c"># 1  (sisa bagi)</span>
<span class="k">print</span>(2 ** 3)  <span class="c"># 8  (pangkat)</span></pre>
<h2>Operator perbandingan</h2><p>Hasilnya selalu <code>True</code> atau <code>False</code>: <code>==</code> (sama dengan), <code>!=</code> (tidak sama), <code>&gt;</code>, <code>&lt;</code>, <code>&gt;=</code>, <code>&lt;=</code>.</p>
<pre><span class="k">print</span>(5 == 5)
<span class="k">print</span>(5 != 5)</pre><div class="out">True<br>False</div>
<div class="note">Satu tanda <code>=</code> berarti <b>menyimpan</b> nilai. Dua tanda <code>==</code> berarti <b>membandingkan</b>.</div>`,
q:[{q:'Hasil dari 10 % 3 adalah...',o:['3','1','0'],a:1,e:'10 dibagi 3 bersisa 1.'},
{q:'Hasil dari 2 ** 4 adalah...',o:['8','6','16'],a:2,e:'Dua pangkat empat sama dengan 16.'},
{q:'Untuk membandingkan dua nilai sama atau tidak, gunakan...',o:['=','==','=>'],a:1,e:'== membandingkan, sedangkan = menyimpan.'}]},
{t:'Percabangan if',d:'Mengambil keputusan dalam program',
c:`<p>Program bisa memilih jalan sesuai kondisi memakai <code>if</code>, <code>elif</code>, dan <code>else</code>. Perhatikan titik dua dan <b>indentasi</b> (menjorok 4 spasi): itulah cara Python menandai isi blok.</p>
<pre>nilai = 78
<span class="k">if</span> nilai &gt;= 85:
    <span class="k">print</span>(<span class="s">"A"</span>)
<span class="k">elif</span> nilai &gt;= 70:
    <span class="k">print</span>(<span class="s">"B"</span>)
<span class="k">else</span>:
    <span class="k">print</span>(<span class="s">"Perlu belajar lagi"</span>)</pre><div class="out">B</div>
<p>Python memeriksa dari atas dan berhenti di kondisi pertama yang benar. Kondisi bisa digabung dengan <code>and</code>, <code>or</code>, dan <code>not</code>.</p>`,
q:[{q:'Apa yang wajib ada di akhir baris if?',o:['Titik koma ;','Titik dua :','Tanda seru !'],a:1,e:'Baris if, elif, dan else selalu diakhiri titik dua.'},
{q:'Jika nilai = 90, output kode di atas adalah...',o:['A','B','Perlu belajar lagi'],a:0,e:'90 >= 85 benar, jadi cabang pertama berjalan.'},
{q:'Python menentukan isi blok if dengan...',o:['Kurung kurawal { }','Indentasi','Kata end'],a:1,e:'Indentasi menentukan baris mana yang masuk blok.'}]},
{t:'Perulangan',d:'Mengulang tugas dengan for dan while',
c:`<p>Perulangan menjalankan kode berkali-kali tanpa menulisnya berulang.</p>
<h2>for: jumlah ulangan sudah diketahui</h2>
<pre><span class="k">for</span> i <span class="k">in</span> <span class="k">range</span>(3):
    <span class="k">print</span>(<span class="s">"Ulangan ke"</span>, i)</pre><div class="out">Ulangan ke 0<br>Ulangan ke 1<br>Ulangan ke 2</div>
<p><code>range(3)</code> menghasilkan 0, 1, 2. Hitungan dimulai dari 0 dan berhenti sebelum angka 3.</p>
<h2>while: ulangi selama kondisi benar</h2>
<pre>n = 3
<span class="k">while</span> n &gt; 0:
    <span class="k">print</span>(n)
    n = n - 1</pre><div class="out">3<br>2<br>1</div>
<div class="note">Pastikan kondisi while suatu saat menjadi salah. Kalau tidak, program berputar tanpa henti.</div>`,
q:[{q:'range(4) menghasilkan angka...',o:['1, 2, 3, 4','0, 1, 2, 3','0, 1, 2, 3, 4'],a:1,e:'range mulai dari 0 dan berhenti sebelum angka batas.'},
{q:'Kapan while berhenti?',o:['Saat kondisinya menjadi False','Setelah 10 kali','Tidak pernah'],a:0,e:'while terus berjalan selama kondisinya True.'},
{q:'Berapa kali "Hai" tampil pada for i in range(5): print("Hai")?',o:['4','5','6'],a:1,e:'range(5) menghasilkan lima nilai, jadi lima kali.'}]},
{t:'Fungsi',d:'Membungkus kode agar bisa dipakai ulang',
c:`<p>Fungsi adalah kumpulan perintah yang diberi nama. Buat dengan <code>def</code>, lalu panggil kapan saja.</p>
<pre><span class="k">def</span> sapa(nama):
    <span class="k">return</span> <span class="s">"Halo, "</span> + nama + <span class="s">"!"</span>

<span class="k">print</span>(sapa(<span class="s">"Budi"</span>))
<span class="k">print</span>(sapa(<span class="s">"Ani"</span>))</pre><div class="out">Halo, Budi!<br>Halo, Ani!</div>
<p><code>nama</code> disebut <b>parameter</b>, yaitu data masukan fungsi. <code>return</code> mengirim hasil kembali ke tempat fungsi dipanggil.</p>
<pre><span class="k">def</span> luas_persegi(sisi):
    <span class="k">return</span> sisi * sisi

hasil = luas_persegi(5)
<span class="k">print</span>(hasil)</pre><div class="out">25</div>
`,
q:[{q:'Kata kunci untuk membuat fungsi adalah...',o:['func','def','function'],a:1,e:'Python memakai def.'},
{q:'Apa tugas return?',o:['Menghentikan Python','Mengirim hasil keluar dari fungsi','Mencetak ke layar'],a:1,e:'return mengembalikan nilai ke pemanggil fungsi.'},
{q:'Hasil luas_persegi(4) pada contoh di atas adalah...',o:['8','16','4'],a:1,e:'4 * 4 = 16.'}]},
{t:'List (Daftar)',d:'Menyimpan banyak nilai sekaligus',
c:`<p>List menyimpan banyak nilai dalam satu variabel, ditulis di dalam kurung siku. Urutan dihitung dari <b>0</b>.</p>
<pre>buah = ["apel", "jeruk", "mangga"]
print(buah[0])
buah.append("pisang")
print(len(buah))
for b in buah:
    print(b)</pre><div class="out">apel<br>4<br>apel<br>jeruk<br>mangga<br>pisang</div>
<p><code>append()</code> menambah item di akhir, <code>len()</code> menghitung jumlah item, dan <code>buah[-1]</code> mengambil item terakhir. Kamu juga bisa menghapus dengan <code>buah.pop(0)</code> (hapus item pada indeks 0).</p>`,

{q:'Cara menambah item di akhir list?',o:['list.add(x)','list.append(x)','list.push(x)'],a:1,e:'Python memakai append().'},

c:`<p>Saatnya menggabungkan semuanya. Komputer memilih angka rahasia, dan pemain menebak sampai benar. Simpan sebagai <code>tebak.py</code>, lalu jalankan dengan <code>python tebak.py</code> di terminal.</p>
<pre>import random

const PASS=4, KEY='pylangkah-progress-v1';
let done=[];
try{done=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){done=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
const unlocked=i=>i===0||done.includes(i-1);
const $=s=>document.querySelector(s);
const app=$('#app');
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}

function home(){
 const pct=Math.round(done.length/L.length*100);
 const next=L.findIndex((_,i)=>!done.includes(i));
 app.innerHTML=`<section class="hero">${cheatMsg?'<div class="res fail" role="alert" style="margin:0 0 18px">Kuis dibatalkan karena kamu meninggalkan halaman saat kuis berlangsung. Semua progres direset dari awal.</div>':''}<h1>Belajar Python, satu langkah dalam satu waktu.</h1>
 <p>${L.length} materi untuk pemula, dari <code>print()</code> sampai dua proyek pertamamu. Setiap materi punya kuis. Lulus kuis (minimal ${PASS} dari 5 benar) untuk membuka materi berikutnya.</p>
 ${next===-1?'<a class="btn pri" href="#/">Kursus selesai, kerja bagus!</a>':`<a class="btn pri" href="#/l/${next}">${done.length?'Lanjutkan belajar':'Mulai dari materi 1'}</a>`}
 <div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><b style="width:${pct}%"></b></div>
 <div class="small">${done.length} dari ${L.length} materi selesai</div><button class="lnk" id="rb">Rollback progres</button></section>
 <ol class="trail">${L.map((l,i)=>{const d=done.includes(i),o=unlocked(i);const cls=d?'st-done':o?'st-open':'st-lock';
 return `<li class="${cls}"><div class="dot">${d?'✓':o?i+1:'🔒'}</div><a class="node" href="#/l/${i}" data-i="${i}"><span class="tag">${d?'Selesai':o?'Terbuka':'Terkunci'}</span><h3>${l.t}</h3><span>${o?l.d:'Selesaikan materi '+i+' untuk membuka'}</span></a></li>`}).join('')}</ol>`;
 $('#rb').onclick=rollback;
 app.querySelectorAll('.st-lock a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();toast('Materi ini terkunci. Lulus kuis materi sebelumnya dulu.')}));
}

function lesson(i){
 const l=L[i];cheatMsg=false;
 app.innerHTML=`<article class="lesson"><div class="crumb" id="crumb"><a href="#/">Peta materi</a> / Materi ${i+1} dari ${L.length}</div>
 <div id="mat"><h1>${l.t}</h1><div class="small">${l.d}</div>${l.c}</div>
 <section class="quiz" id="qz"></section>
 <div class="actions" id="nav"><a class="btn" href="${i?'#/l/'+(i-1):'#/'}">${i?'Materi sebelumnya':'Kembali ke peta'}</a></div></article>`;
 app.querySelectorAll('pre').forEach(p=>{if(p.querySelector('span'))return;
  p.innerHTML=p.innerHTML.replace(/(#[^\n]*)|("[^"\n]*"|'[^'\n]*')|\b(def|if|elif|else|for|while|in|return|import|try|except|print|input|int|len|range|True|False|break|continue|not|enumerate)\b/g,(m,c,s)=>c?`<span class="c">${m}</span>`:s?`<span class="s">${m}</span>`:`<span class="k">${m}</span>`)});
 app.querySelectorAll('pre').forEach(p=>{const w=document.createElement('div');w.className='pw';p.replaceWith(w);w.append(p);
  const b=document.createElement('button');b.className='try';b.textContent='Coba di Lab';b.onclick=()=>{cells.push(p.textContent);saveCells();location.hash='#/lab'};w.append(b)});
 const pk=l.q.slice(0,2).map((q,qi)=>`<div class="q"><p>${qi+1}. ${q.q}</p>${q.o.map(o=>`<div class="opt"><span>${o}</span></div>`).join('')}</div>`).join('');
 $('#qz').innerHTML=`<h2>Kuis: buktikan kamu paham</h2><p class="small">${l.q.length} soal, minimal ${PASS} benar untuk lulus. Begitu kuis dimulai, materi disembunyikan sampai semua soal selesai. Jangan pindah tab, aplikasi, atau halaman. Kalau itu terjadi, semua progres direset dari awal.</p>
 <div class="peek"><div class="pk" aria-hidden="true">${pk}</div><div class="bl1"></div><div class="bl2"></div><button class="btn pri start" id="start">Mulai kuis</button></div>`;
 $('#start').onclick=()=>startQuiz(i);
 window.scrollTo(0,0);
}
function startQuiz(i){
 const l=L[i],cr=$('#crumb').innerHTML;
 quizActive=true;setLive(true);document.body.classList.add('inquiz');$('#aip').hidden=true;
 $('#mat').hidden=true;$('#nav').hidden=true;$('#crumb').textContent='Materi '+(i+1)+' dari '+L.length;
 const qz=$('#qz');
 qz.innerHTML=`<div class="res fail" role="alert" style="margin:0 0 16px">Kuis sedang berlangsung. Tetap di halaman ini sampai semua soal selesai.</div><h2>${l.t}</h2><div id="qs">${l.q.map((q,qi)=>`<div class="q" data-q="${qi}"><p>${qi+1}. ${q.q}</p>${q.o.map((o,oi)=>`<label class="opt"><input type="radio" name="q${qi}" value="${oi}"><span>${o}</span></label>`).join('')}<div class="exp" hidden>${q.e}</div></div>`).join('')}</div><div class="actions"><button class="btn pri" id="chk">Periksa jawaban</button></div><div id="res"></div>`;
 window.scrollTo(0,0);
 $('#chk').onclick=()=>{
  if(l.q.some((q,qi)=>!qz.querySelector(`input[name=q${qi}]:checked`))){toast('Jawab semua soal dulu ya.');return}
  const picks=l.q.map((q,qi)=>+qz.querySelector(`input[name=q${qi}]:checked`).value);
  const sc=picks.filter((v,qi)=>v===l.q[qi].a).length,ok=sc>=PASS;
  quizActive=false;setLive(null);document.body.classList.remove('inquiz');
  l.q.forEach((q,qi)=>{const box=qz.querySelector(`[data-q="${qi}"]`),v=picks[qi];
   box.querySelectorAll('.opt').forEach((lb,oi)=>{if(ok&&oi===q.a)lb.classList.add('ok');else if(oi===v)lb.classList.add(v===q.a?'ok':'bad')});
   if(ok)box.querySelector('.exp').hidden=false});
  qz.querySelectorAll('input').forEach(x=>x.disabled=true);$('#chk').hidden=true;
  $('#mat').hidden=false;$('#nav').hidden=false;$('#crumb').innerHTML=cr;
  if(ok&&!done.includes(i)){done.push(i);save()}
  const last=i===L.length-1,r=$('#res');
  r.innerHTML=ok?`<div class="res pass">Lulus! Skor ${sc}/${l.q.length}. ${last?'Kamu menamatkan semua materi.':'Materi '+(i+2)+' sekarang terbuka.'}</div><div class="actions"><a class="btn pri" href="${last?'#/':'#/l/'+(i+1)}">${last?'Kembali ke peta':'Lanjut ke materi '+(i+2)}</a></div>`
   :`<div class="res fail">Skor ${sc}/${l.q.length}. Belum lulus. Baca materi di atas lagi, lalu coba kembali. Jawaban yang benar baru ditampilkan setelah kamu lulus.</div><div class="actions"><button id="retry">Coba lagi</button></div>`;
  const rt=$('#retry');if(rt)rt.onclick=()=>lesson(i);
  r.scrollIntoView({behavior:'smooth',block:'center'});
 };
}
const RB_PW='X',BK='pylangkah-backup-v1',LV='pylangkah-live-v1';
let quizActive=false,cheatMsg=false;
function setLive(v){try{v?localStorage.setItem(LV,'1'):localStorage.removeItem(LV)}catch(e){}}
function readBk(){try{return JSON.parse(localStorage.getItem(BK)||'[]')}catch(e){return[]}}
function cheat(){
 quizActive=false;setLive(null);document.body.classList.remove('inquiz');
 if(done.length){try{localStorage.setItem(BK,JSON.stringify([...new Set([...readBk(),...done])]))}catch(e){}}
 done=[];save();cheatMsg=true;
 if(location.hash!=='#/')location.hash='#/';else route();
}
function checkLive(){let v=null;try{v=localStorage.getItem(LV)}catch(e){}if(v)cheat()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&quizActive)cheat()});
function modal(title,text,pw){return new Promise(res=>{
 const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-label="${title}"><h3>${title}</h3><p>${text}</p>${pw?'<input type="password" id="mpw" aria-label="Password" autocomplete="off">':''}<div class="actions"><button class="btn pri" id="mok">${pw?'Rollback':'Ya, hapus'}</button><button id="mno">Batal</button></div></div>`;
 document.body.appendChild(o);const inp=o.querySelector('#mpw');(inp||o.querySelector('#mok')).focus();
 const end=v=>{o.remove();res(v)};
 o.querySelector('#mok').onclick=()=>end(pw?inp.value:true);
 o.querySelector('#mno').onclick=()=>end(null);
 o.onkeydown=e=>{if(e.key==='Escape')end(null);if(e.key==='Enter'&&pw)end(inp.value)};
})}
async function rollback(){
 const v=await modal('Rollback progres','Masukkan password untuk mengembalikan progres sebelum direset.',true);
 if(v===null)return;
 if(v!==RB_PW){toast('Password salah.');return}
 const b=readBk();
 if(!b.length){toast('Tidak ada progres yang bisa dikembalikan.');return}
 done=[...new Set([...b,...done])].sort((x,y)=>x-y);save();try{localStorage.removeItem(BK)}catch(e){}
 cheatMsg=false;home();toast('Progres dikembalikan.');
}

try{cells=JSON.parse(localStorage.getItem(LK)||'[]')}catch(e){cells=[]}
const saveCells=()=>{try{localStorage.setItem(LK,JSON.stringify(cells))}catch(e){}};
const SRC=[['https://cdnjs.cloudflare.com/ajax/libs/skulpt/1.2.0/skulpt.min.js','https://cdnjs.cloudflare.com/ajax/libs/skulpt/1.2.0/skulpt-stdlib.js'],['https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js','https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js']];
let skP=null,skReady=false;
function loadSk(){if(skReady)return Promise.resolve();if(skP)return skP;
 const ld=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>no();document.head.appendChild(s)});
 skP=(async()=>{for(const [a,b] of SRC){try{await ld(a);await ld(b);if(window.Sk){skReady=true;return}}catch(e){}}throw 0})().catch(e=>{skP=null;throw e});return skP}
async function runCell(i,out,btn){
 out.textContent='';btn.disabled=true;btn.textContent='Berjalan...';
 const add=(t,c)=>{const s=document.createElement('span');if(c)s.className=c;s.textContent=t;out.appendChild(s)};
 try{await loadSk()}catch(e){add('Mesin Python gagal dimuat. Periksa koneksi internet, lalu muat ulang halaman.','er');btn.disabled=false;btn.textContent='Jalankan';return}
 Sk.configure({output:t=>add(t),read:x=>{if(!Sk.builtinFiles||Sk.builtinFiles.files[x]===undefined)throw "File not found: '"+x+"'";return Sk.builtinFiles.files[x]},__future__:Sk.python3,execLimit:20000,inputfunTakesPrompt:true,
  inputfun:p=>new Promise(res=>{const row=document.createElement('span');const lb=document.createElement('span');lb.textContent=p;const inp=document.createElement('input');inp.setAttribute('aria-label','Jawaban untuk input');row.append(lb,inp);out.appendChild(row);inp.focus();
   inp.onkeydown=e=>{if(e.key==='Enter'){inp.disabled=true;out.appendChild(document.createTextNode('\n'));Sk.execStart=Date.now();res(inp.value)}}})});
 Sk.execStart=Date.now();
 try{await Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody('<stdin>',false,cells[i],true))}
 catch(e){const t=out.textContent;add((t&&!t.endsWith('\n')?'\n':'')+e.toString()+'\n','er')}
 if(!out.textContent)add('Selesai, tidak ada output. Gunakan print() untuk menampilkan hasil.','mute');
 btn.disabled=false;btn.textContent='Jalankan';
}
function drawCells(){
 const box=$('#cells');box.innerHTML='';
 cells.forEach((code,i)=>{
  const c=document.createElement('div');c.className='cell';
  c.innerHTML=`<textarea spellcheck="false" aria-label="Sel kode ${i+1}"></textarea><div class="crow"><button class="btn pri run">Jalankan</button><button class="clr">Hapus output</button><button class="aibtn ai-e">Jelaskan (AI)</button><button class="aibtn ai-f">Perbaiki (AI)</button><span class="sp"></span><button class="del">Hapus sel</button></div><div class="outbox" role="log" aria-live="polite"></div>`;
  const ta=c.querySelector('textarea'),out=c.querySelector('.outbox'),run=c.querySelector('.run');
  ta.value=code;
  const fit=()=>{ta.style.height='auto';ta.style.height=Math.max(96,ta.scrollHeight)+'px'};
  ta.addEventListener('input',()=>{cells[i]=ta.value;saveCells();fit()});
  ta.addEventListener('keydown',e=>{
   if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart;ta.setRangeText('    ',s,ta.selectionEnd,'end');ta.dispatchEvent(new Event('input'))}
   else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey||e.shiftKey)){e.preventDefault();if(!run.disabled)runCell(i,out,run)}
   else if(e.key==='Enter'&&ta.selectionStart===ta.selectionEnd){e.preventDefault();const v=ta.value,s=ta.selectionStart,ln=v.slice(v.lastIndexOf('\n',s-1)+1,s);ta.setRangeText('\n'+ln.match(/^ */)[0]+(ln.trimEnd().endsWith(':')?'    ':''),s,s,'end');ta.dispatchEvent(new Event('input'))}});
  ta.addEventListener('focus',()=>{lastTa=ta});
  c.querySelector('.ai-e').onclick=()=>askAI('Jelaskan kode Python ini baris demi baris dengan bahasa sederhana untuk pemula:\n```python\n'+ta.value+'\n```');
  c.querySelector('.ai-f').onclick=()=>askAI('Kodeku bermasalah atau hasilnya tidak sesuai harapan. Tolong cari penyebabnya dan tunjukkan perbaikannya.\n```python\n'+ta.value+'\n```\nOutput atau error:\n'+(out.textContent.trim()||'(belum dijalankan)'));
  run.onclick=()=>runCell(i,out,run);
  c.querySelector('.clr').onclick=()=>{out.textContent=''};
  c.querySelector('.del').onclick=()=>{if(cells.length===1&&!cells[0].trim())return toast('Sel terakhir tidak bisa dihapus.');cells.splice(i,1);if(!cells.length)cells.push('');saveCells();drawCells()};
  box.appendChild(c);fit();
 });
}
function lab(){
 if(!cells.length){cells=['print("Halo, Python!")\n\nfor i in range(3):\n    print("Ulangan", i)'];saveCells()}
 app.innerHTML=`<div class="lesson"><div class="crumb"><a href="#/">Peta materi</a> / Lab Kode</div><h1>Lab Kode</h1>
 <p>Tulis Python lalu jalankan langsung di browser, tanpa instal apa pun. Tiap sel berjalan sendiri, jadi variabel dari satu sel tidak terbawa ke sel lain.</p>
 <p class="small">Pintasan: Ctrl+Enter atau Shift+Enter untuk menjalankan. Tab untuk indentasi. Kodemu tersimpan otomatis di browser ini.</p>
 <div class="chips"><span class="small">Sisipkan potongan kode:</span></div><div class="chips" id="chips"></div>
 <div id="cells"></div><div class="actions"><button class="btn pri" id="add">Tambah sel kode</button></div>
 <div class="note">Mesin Python di sini mendukung sebagian besar fitur dasar yang diajarkan di materi. Library besar seperti numpy atau pandas belum tersedia.</div></div>`;
 drawCells();
 $('#chips').innerHTML=SN.map((s,k)=>`<button class="chip" data-k="${k}">${s[0]}</button>`).join('');
 $('#chips').onmousedown=e=>{if(e.target.closest('.chip'))e.preventDefault()};
 $('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const ta=(lastTa&&document.contains(lastTa))?lastTa:[...document.querySelectorAll('.cell textarea')].pop();insSnip(ta,SN[b.dataset.k][1])};
 $('#add').onclick=()=>{cells.push('');saveCells();drawCells();const t=document.querySelectorAll('.cell textarea');t[t.length-1].focus()};
 window.scrollTo(0,0);
}
let lastTa=null,sample=null,busy=false,ctrl=null,msgs=[];
const SN=[['print','print("|")'],['input','nama = input("|")'],['if','if |:\n    '],['for','for i in range(|):\n    '],['while','while |:\n    '],['def','def nama(|):\n    return '],['list','daftar = [|]'],['dict','data = {"|": }'],['try','try:\n    |\nexcept ValueError:\n    print("Error")']];
function insSnip(ta,t){if(!ta)return;const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value,ind=(v.slice(v.lastIndexOf('\n',s-1)+1,s).match(/^ */)||[''])[0];
 let x=t.split('\n').join('\n'+ind);const c=x.indexOf('|');x=x.replace('|','');ta.setRangeText(x,s,e,'end');if(c>=0)ta.setSelectionRange(s+c,s+c);ta.dispatchEvent(new Event('input'));ta.focus()}
const SYS='Kamu tutor Python yang sabar untuk pemula di Indonesia. Jawab dalam bahasa Indonesia yang sederhana dan singkat (maksimal sekitar 150 kata). Beri contoh kode kecil dalam blok ```python bila membantu. Kode siswa dijalankan di mesin Python dasar di browser, jadi hindari numpy, pandas, dan library eksternal. Jika siswa meminta jawaban kuis, beri petunjuk saja, jangan jawabannya. Jika pertanyaan di luar topik belajar Python, arahkan kembali dengan ramah.';
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function fmt(t){return t.split(/```(?:python|py)?\n?/).map((p,i)=>i%2?`<pre>${esc(p.replace(/\n$/,''))}</pre>`:esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')).join('')}
function addTry(root){root.querySelectorAll('pre').forEach(p=>{if(p.parentNode.className==='pw')return;const w=document.createElement('div');w.className='pw';p.replaceWith(w);w.append(p);
 const b=document.createElement('button');b.className='try';b.textContent='Coba di Lab';b.onclick=()=>{cells.push(p.textContent);saveCells();aiOpen(false);if(location.hash==='#/lab')lab();else location.hash='#/lab'};w.append(b)})}
document.body.insertAdjacentHTML('beforeend',`<button class="fab" id="fab">Tanya AI</button><section class="aip" id="aip" hidden role="dialog" aria-label="Tanya AI"><div class="aih"><b>Tanya AI</b><select id="aiv" aria-label="Sumber AI" style="font:600 14px Figtree,sans-serif;border:1.5px solid var(--line);border-radius:8px;padding:5px;background:var(--bg);color:var(--ink);max-width:48vw"><option value="claude" disabled>Claude</option><option value="ext" selected>API eksternal (GLM)</option></select><span class="sp"></span><button id="aix">Tutup</button></div><div class="msgs" id="msgs" aria-live="polite"></div><div class="aif"><textarea id="aiq" rows="2" placeholder="Tulis pertanyaanmu tentang Python..." aria-label="Pertanyaan"></textarea><button class="btn pri" id="ais">Kirim</button></div></section>`);
const HINTS=['Apa beda list dan dictionary?','Jelaskan for loop dengan contoh sederhana','Kenapa muncul IndentationError?'];
function resetMsgs(){$('#msgs').innerHTML='<div class="hint"><p class="small">Tanyakan apa saja tentang Python. Beberapa ide:</p>'+HINTS.map(h=>`<div style="margin:6px 0"><button class="chip">${h}</button></div>`).join('')+'</div>'}
resetMsgs();
function aiOpen(o){$('#aip').hidden=!o;$('#fab').hidden=o;if(o)$('#aiq').focus()}
function bubble(c,t){const m=$('#msgs');const h=m.querySelector('.hint');if(h)h.remove();const b=document.createElement('div');b.className='m '+c;if(c==='u')b.textContent=t;else b.innerHTML=t;m.appendChild(b);m.scrollTop=m.scrollHeight;return b}
function ctx(){const m=location.hash.match(/^#\/l\/(\d+)$/);return m&&L[+m[1]]?'Siswa sedang membaca materi "'+L[+m[1]].t+'"':location.hash==='#/lab'?'Siswa sedang memakai Lab Kode':'Siswa sedang di peta materi'}
async function askExt(turns){
 const hist=turns.map(m=>(m.role==='user'?'Siswa: ':'Tutor: ')+m.content).join('\n\n');
 const u='https://api.siputzx.my.id/api/ai/glm47flash?'+new URLSearchParams({prompt:hist.slice(-3500),system:SYS,temperature:'0.7'});
 const r=await fetch(u,{signal:ctrl.signal});
 if(!r.ok)throw {code:'http'};
 const j=await r.json().catch(()=>null);
 const pick=x=>typeof x==='string'?x:x&&typeof x==='object'?(pick(x.response)||pick(x.content)||pick(x.text)||pick(x.message)||pick(x.result)||pick(x.data)||''):'';
 const t=pick(j&&(j.data??j.result??j.response??j));
 if(!t)throw {code:'format'};
 return t}
async function send(text){
 if(busy||!text.trim())return;
 busy=true;$('#ais').textContent='Hentikan';$('#aiq').value='';
 msgs.push({role:'user',content:text});bubble('u',text);const b=bubble('a','Berpikir...');
 const turns=msgs.slice(-7).map(m=>({role:m.role,content:m.content}));
 turns[turns.length-1].content+='\n\n[Konteks: '+ctx()+']';
 ctrl=new AbortController();
 const useExt=$('#aiv').value==='ext'||!sample;
 try{let txt;
  if(useExt)txt=await askExt(turns);
  else{turns[0].content=SYS+'\n\n'+turns[0].content;const r=await sample(turns,{onText:({text})=>{b.innerHTML=fmt(text);$('#msgs').scrollTop=$('#msgs').scrollHeight},signal:ctrl.signal,cache:false});txt=r.text}
  msgs.push({role:'assistant',content:txt});b.innerHTML=fmt(txt);addTry(b)}
 catch(e){msgs.pop();const c=e&&e.code,n=e&&e.name;b.textContent=(c==='cancelled'||n==='AbortError')?'Dihentikan.':c==='not_granted'?'Izin ditolak, jadi AI tidak bisa dipakai.':c==='rate_limited'?'Terlalu banyak permintaan. Tunggu sebentar lalu coba lagi.':c==='format'?'Respons dari API eksternal tidak dikenali.':c==='http'?'API eksternal sedang bermasalah. Coba lagi nanti.':useExt?'Tidak bisa terhubung ke API eksternal. Di halaman terbit ini koneksi ke situs lain diblokir, jadi buka file HTML-nya langsung di perangkatmu. Bisa juga karena internetmu atau API-nya sedang bermasalah.':'AI sedang tidak bisa menjawab. Coba lagi nanti.';b.classList.add('err')}
 busy=false;ctrl=null;$('#ais').textContent='Kirim';
}
function askAI(t){aiOpen(true);send(t)}
$('#fab').onclick=()=>aiOpen(true);
$('#aix').onclick=()=>aiOpen(false);
$('#ais').onclick=()=>{if(busy&&ctrl)ctrl.abort();else send($('#aiq').value)};
$('#aiq').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send($('#aiq').value)}};
$('#msgs').onclick=e=>{const c=e.target.closest('.hint .chip');if(c)send(c.textContent)};

if(window.claude&&claude.use)claude.use('sample').then(s=>{if(s){sample=s;$('#aiv').querySelector('[value=claude]').disabled=false;$('#aiv').value='claude'}}).catch(()=>{});
function route(){
 if(quizActive)return cheat();
 if(location.hash==='#/lab')return lab();
 const m=location.hash.match(/^#\/l\/(\d+)$/);
 if(m){const i=+m[1];
  if(i>=L.length)return location.hash='#/';
  if(!unlocked(i)){toast('Materi ini terkunci. Selesaikan materi sebelumnya dulu.');return location.hash='#/'}

 home();window.scrollTo(0,0);
